spring.application.name=queueease

# Server Configuration (picks up cloud PORT environment variable if set, defaults to 8080)
server.port=${PORT:8080}

# MySQL Database Configuration (Aiven Cloud with environment variable override support)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://queueease-db-harshinioladri-81f9.j.aivencloud.com:22330/defaultdb?sslMode=REQUIRED}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CORS Configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://queue-ease-smart-queue-management.vercel.app}